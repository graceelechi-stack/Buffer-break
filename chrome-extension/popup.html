<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f4f4f6;
    --surface-hover: #ebebef;
    --border: #e4e4e8;
    --text: #18181b;
    --muted: #71717a;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --on-accent: #ffffff;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 1px rgba(0, 0, 0, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --surface: #232327;
      --surface-hover: #2c2c31;
      --border: #303036;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
      --on-accent: #111127;
      --danger: #f87171;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    width: 300px; margin: 0; padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 32px; height: 32px; flex: none; border-radius: 9px;
    display: grid; place-items: center; color: var(--on-accent); background: var(--accent);
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }

  .label { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

  /* Segmented control */
  .segmented {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px;
    background: var(--surface); border-radius: 10px;
  }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label {
    padding: 7px 8px; text-align: center; font-weight: 500; color: var(--muted);
    border-radius: 7px; cursor: pointer; transition: background .15s, color .15s;
  }
  .segmented label:hover { color: var(--text); }
  .segmented input:checked + label { color: var(--text); background: var(--bg); box-shadow: var(--shadow); }
  .segmented input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Timer */
  .timer { display: flex; gap: 6px; margin-top: 8px; }
  .chip {
    flex: 1; height: 32px; font: inherit; font-weight: 500; color: var(--text);
    background: var(--surface); border: 1px solid transparent; border-radius: 8px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .chip:hover { background: var(--surface-hover); }
  .chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: transparent; }
  .custom {
    flex: 1.3; display: flex; align-items: center; gap: 4px; padding: 0 8px;
    background: var(--surface); border: 1px solid transparent; border-radius: 8px;
  }
  .custom:focus-within, .custom.active { border-color: var(--accent); }
  .custom.active input { color: var(--accent); }
  .custom input::placeholder { color: var(--muted); font-weight: 400; }
  .custom input {
    width: 100%; min-width: 0; padding: 0; font: inherit; font-weight: 500; text-align: right;
    color: var(--text); background: transparent; border: 0; outline: none;
    -moz-appearance: textfield;
  }
  .custom input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .custom span { color: var(--muted); font-size: 12px; }
  .custom input:placeholder-shown { text-align: center; }
  .custom input:placeholder-shown + span { display: none; }
  .chip:focus-visible, .edit:focus-visible, #freeze:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Shortcuts */
  .shortcuts { border: 1px solid var(--border); border-radius: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; }
  .row + .row { border-top: 1px solid var(--border); }
  .row > span:first-child { color: var(--muted); }
  .keys { display: flex; align-items: center; gap: 4px; }
  kbd {
    min-width: 22px; height: 22px; padding: 0 6px;
    display: inline-grid; place-items: center;
    font: 500 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 6px;
  }
  .edit {
    margin-left: 6px; padding: 2px; display: grid; place-items: center;
    color: var(--muted); background: none; border: 0; border-radius: 4px; cursor: pointer;
  }
  .edit:hover { color: var(--text); }

  /* Action */
  #freeze {
    height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-weight: 600; color: var(--on-accent);
    background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
    transition: background .15s, transform .05s;
  }
  #freeze:hover { background: var(--accent-hover); }
  #freeze:active { transform: scale(.98); }
  #error { margin: -6px 0 0; font-size: 12px; color: var(--danger); }

  /* Icon picker accordion */
  .accordion { border: 1px solid var(--border); border-radius: 10px; }
  .accordion-toggle {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; font: inherit; color: var(--muted); text-align: left;
    background: none; border: 0; border-radius: 10px; cursor: pointer;
  }
  .accordion-toggle:hover { color: var(--text); }
  .accordion-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .accordion-toggle .current { display: flex; align-items: center; gap: 8px; }
  .accordion-toggle canvas { width: 20px; height: 20px; }
  .chevron { transition: transform .2s; }
  .accordion-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .accordion-panel {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .2s ease;
  }
  .accordion-panel > .icons { min-height: 0; overflow: hidden; padding: 0 12px; }
  .accordion-toggle[aria-expanded="true"] + .accordion-panel { grid-template-rows: 1fr; }
  .accordion-toggle[aria-expanded="true"] + .accordion-panel > .icons { padding-bottom: 12px; padding-top: 2px; }
  .icons { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .icon-option {
    aspect-ratio: 1; padding: 0; display: grid; place-items: center;
    background: var(--surface); border: 1px solid transparent; border-radius: 8px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .icon-option:hover { background: var(--surface-hover); }
  .icon-option[aria-checked="true"] { border-color: var(--accent); background: transparent; }
  .icon-option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-option canvas { width: 20px; height: 20px; }

  .wink { margin: -4px 0 0; text-align: center; font-size: 12px; color: var(--muted); text-wrap: balance; }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3" width="3" height="10" rx="1"/><rect x="9.5" y="3" width="3" height="10" rx="1"/></svg>
    </div>
    <div>
      <h1>Buffer Break</h1>
      <p>Make this tab look frozen.</p>
    </div>
  </header>

  <section>
    <p class="label">Duration</p>
    <div class="segmented" role="radiogroup">
      <input type="radio" name="mode" value="manual" id="mode-manual">
      <label for="mode-manual">Until I unfreeze</label>
      <input type="radio" name="mode" value="timed" id="mode-timed">
      <label for="mode-timed">Timer</label>
    </div>
    <div class="timer" id="timer" hidden>
      <button class="chip" data-minutes="5">5m</button>
      <button class="chip" data-minutes="10">10m</button>
      <button class="chip" data-minutes="15">15m</button>
      <button class="chip" data-minutes="30">30m</button>
      <label class="custom"><input type="number" id="minutes" min="1" max="240" placeholder="Other" aria-label="Custom minutes"><span>min</span></label>
    </div>
  </section>

  <section class="shortcuts">
    <div class="row">
      <span>Freeze</span>
      <span class="keys"><span class="keys" id="freeze-keys"><kbd>Alt</kbd><kbd>Shift</kbd><kbd>F</kbd></span>
        <button class="edit" id="change-keys" title="Change shortcut" aria-label="Change shortcut">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2.5l2.5 2.5L6 12.5 3 13l.5-3z"/></svg>
        </button>
      </span>
    </div>
    <div class="row">
      <span>Unfreeze</span>
      <span class="keys"><kbd>Ctrl</kbd><kbd>U</kbd></span>
    </div>
  </section>

  <section class="accordion">
    <button class="accordion-toggle" id="icon-toggle" aria-expanded="false" aria-controls="icons">
      <span>Toolbar icon</span>
      <span class="current">
        <canvas id="current-icon" aria-hidden="true"></canvas>
        <svg class="chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
      </span>
    </button>
    <div class="accordion-panel" id="icon-panel">
      <div class="icons" id="icons" role="radiogroup" aria-label="Toolbar icon"></div>
    </div>
  </section>

  <p id="error" hidden></p>
  <button id="freeze">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10" rx="1"/><rect x="9.5" y="3" width="3" height="10" rx="1"/></svg>
    Freeze this tab
  </button>
  <p class="wink">Go on, stretch, sip, scroll. We'll blame the browser. 😉</p>
  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
